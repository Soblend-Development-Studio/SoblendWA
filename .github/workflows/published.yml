name: published

# After a release, install what landed on npm, PyPI and crates.io on clean runners and connect to WhatsApp until
# the first QR. Nothing gets linked: it proves the published packages load and get through the real handshake.
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Versión publicada (vacío = la del Cargo.toml)
        required: false

jobs:
  version:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: pick
        env:
          ASKED: ${{ inputs.version }}
        run: |
          version="${ASKED:-$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  npm:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tests/published
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Wait for npm
        run: for i in $(seq 30); do npm view "soblendwa-node@${{ needs.version.outputs.version }}" version && exit 0; sleep 20; done; exit 1
      - name: Install in an empty folder and connect
        run: |
          mkdir "$RUNNER_TEMP/clean" && cd "$RUNNER_TEMP/clean"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "soblendwa-node@${{ needs.version.outputs.version }}"
          node "$GITHUB_WORKSPACE/tests/published/qr.js"

  pypi:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tests/published
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Wait for PyPI
        run: for i in $(seq 30); do pip download --no-deps -q -d "$RUNNER_TEMP/probe" "soblendwa==${{ needs.version.outputs.version }}" && exit 0; sleep 20; done; exit 1
      - name: Install in a fresh venv and connect
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ -x "$RUNNER_TEMP/venv/bin/python" ]; then py="$RUNNER_TEMP/venv/bin/python"; else py="$RUNNER_TEMP/venv/Scripts/python"; fi
          "$py" -m pip install -q "soblendwa==${{ needs.version.outputs.version }}"
          cd "$RUNNER_TEMP" && "$py" -I "$GITHUB_WORKSPACE/tests/published/qr.py"

  crates:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tests/published
      - uses: dtolnay/rust-toolchain@stable
      - name: Wait for crates.io
        run: for i in $(seq 30); do curl -sf -A soblendwa-published-check "https://crates.io/api/v1/crates/soblendwa/${{ needs.version.outputs.version }}" > /dev/null && exit 0; sleep 20; done; exit 1
      - name: New crate on the published version and connect
        run: |
          cd "$RUNNER_TEMP" && cargo new -q clean && cd clean
          cargo add -q "soblendwa@=${{ needs.version.outputs.version }}"
          cargo add -q tokio --features macros,rt-multi-thread
          cp "$GITHUB_WORKSPACE/tests/published/qr.rs" src/main.rs
          cargo run -q
