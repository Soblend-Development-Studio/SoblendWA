name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features "sqlite mongo testing" -- -D warnings
      - run: cargo test --features "sqlite mongo testing" --lib
      - run: cargo test --doc
      - run: cargo test -p soblendwa-server

  minimum-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p soblendwa --features stores

  fake-whatsapp-from-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: cargo build --release -p soblendwa-server
      - run: |
          ./target/release/soblendwa-server --fake --port 8787 --session bot --session ana &
          sleep 5
          node clients/js/soak.mjs --sessions bot,ana --hours 0.01 --interval 2 --media-every 3 --pid $! --out soak.jsonl
      - uses: actions/upload-artifact@v7
        with:
          name: soak-report
          path: soak.jsonl

  bindings-on-fake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: cargo build -p soblendwa-node && cp target/debug/libsoblendwa_node.so bindings/node/soblendwa.node
      - run: node bindings/node/test-fake.js
      - run: cargo build -p soblendwa-python --features extension-module && cp target/debug/lib_native.so bindings/python/python/soblendwa/_native.abi3.so
      - run: python bindings/python/test_fake.py
        env:
          PYTHONPATH: bindings/python/python

  real-databases:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: soblend
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      SOBLEND_MONGO_URL: mongodb://127.0.0.1:27017
      SOBLEND_POSTGRES_URL: postgres://postgres:soblend@127.0.0.1:5432/postgres
      SOBLEND_REDIS_URL: redis://127.0.0.1:6379/
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: cargo test --features "stores testing" --lib -- --ignored mongo_roundtrip zapo_mongo_live postgres_roundtrip redis_roundtrip
      - run: cargo build -p soblendwa-node && cp target/debug/libsoblendwa_node.so bindings/node/soblendwa.node
      - run: |
          node bindings/node/store-check.js "{\"type\":\"mongo\",\"url\":\"$SOBLEND_MONGO_URL\",\"database\":\"soblendwa_ci\"}"
          node bindings/node/store-check.js "{\"type\":\"postgres\",\"url\":\"$SOBLEND_POSTGRES_URL\"}"
          node bindings/node/store-check.js "{\"type\":\"redis\",\"url\":\"$SOBLEND_REDIS_URL\"}"
          node bindings/node/store-check.js "{\"type\":\"sqlite\",\"path\":\"ci-store.db\"}"
