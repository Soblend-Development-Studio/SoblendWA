[package]
name = "soblendwa-node"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
authors = ["Soblend Development Studio"]
description = "Node.js bindings for SoblendWA. Crafted by Soblend Development Studio."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi6", "async", "serde-json"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soblendwa-bridge = { path = "../bridge" }

[build-dependencies]
napi-build = "2"
