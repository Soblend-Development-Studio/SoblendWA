[package]
name = "soblendwa-server"
version = "0.2.1"
edition = "2021"
rust-version = "1.89"
authors = ["Soblend Development Studio"]
description = "WebSocket and HTTP server to use SoblendWA from any language. By Soblend Development Studio."
license = "MIT"
publish = false

[[bin]]
name = "soblendwa-server"
path = "src/main.rs"

[dependencies]
mimalloc = { version = "0.1", default-features = false }
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
parking_lot = "0.12"
qrcode = { version = "0.14", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json = "1"
soblendwa = { path = "../..", features = ["testing"] }
soblendwa-bridge = { path = "../bridge" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-tungstenite = "0.24"
