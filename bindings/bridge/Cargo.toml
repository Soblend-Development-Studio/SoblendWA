[package]
name = "soblendwa-bridge"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
authors = ["Soblend Development Studio"]
description = "Session layer shared by the SoblendWA Node.js and Python bindings."
license = "MIT"
publish = false

[dependencies]
async-trait = "0.1"
base64 = "0.22"
dashmap = "6"
hex = "0.4"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soblendwa = { path = "../..", features = ["stores", "testing"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
