[package]
name = "soblendwa-python"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
authors = ["Soblend Development Studio"]
description = "Python bindings for SoblendWA."
license = "MIT"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
mimalloc = { version = "0.1", default-features = false }
pyo3 = { version = "0.30", features = ["abi3-py39", "experimental-async"] }
serde_json = "1"
soblendwa-bridge = { path = "../bridge" }

[features]
extension-module = ["pyo3/extension-module"]
